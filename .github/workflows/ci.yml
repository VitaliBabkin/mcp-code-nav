name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The suite against the real clangd, clang-query, gopls and TypeScript 7 native server. MCP_CODE_NAV_LIVE_REQUIRE
  # turns a missing tool into a failure instead of a silent skip. The job is advisory: continue-on-error.
  live:
    name: Live tests (real language servers)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MCP_CODE_NAV_LIVE_REQUIRE: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install clangd, clang-query and a C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clangd-18 clang-tools-18
          sudo ln -sf /usr/bin/clangd-18 /usr/local/bin/clangd
          sudo ln -sf /usr/bin/clang-query-18 /usr/local/bin/clang-query
      - name: Install gopls
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install the TypeScript 7 native server
        run: npm install -g typescript@7
      - run: npm ci
      - run: npm run test:live
