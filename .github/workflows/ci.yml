name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The suite against the real clangd, clang-query, gopls and TypeScript 7 native server, once with the minimum
  # version of every tool and once with the latest. The minimums are the README's Requirements table: change both
  # together. MCP_CODE_NAV_LIVE_REQUIRE turns a missing tool into a failure instead of a silent skip. The job is
  # advisory (continue-on-error) until it has been seen green on a hosted runner.
  live:
    name: Live tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum tool versions
            node: 20
            go: "1.21.13"
            gopls: v0.15.0
            clangd: "22.1.0"
            clang-tools: 14
            typescript: 7.0.1-rc
          - label: latest tool versions
            node: 22
            go: stable
            gopls: latest
            clangd: latest
            clang-tools: 20
            typescript: latest
    env:
      MCP_CODE_NAV_LIVE_REQUIRE: all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install clang-query
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-${{ matrix.clang-tools }} clang-tools-${{ matrix.clang-tools }}
          sudo ln -sf /usr/bin/clang-query-${{ matrix.clang-tools }} /usr/local/bin/clang-query
      - name: Install clangd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ matrix.clangd }}"
          if [ "$tag" = latest ]; then
            tag=$(gh api repos/clangd/clangd/releases/latest --jq .tag_name)
          fi
          curl -fsSL -o "$RUNNER_TEMP/clangd.zip" "https://github.com/clangd/clangd/releases/download/${tag}/clangd-linux-${tag}.zip"
          unzip -q "$RUNNER_TEMP/clangd.zip" -d "$RUNNER_TEMP/clangd"
          echo "$RUNNER_TEMP/clangd/clangd_${tag}/bin" >> "$GITHUB_PATH"
      - name: Install gopls
        run: |
          go install golang.org/x/tools/gopls@${{ matrix.gopls }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install the TypeScript 7 native server
        run: npm install -g typescript@${{ matrix.typescript }}
      - name: Tool versions
        run: |
          node --version
          go version
          gopls version
          clangd --version
          clang-query --version
          npm ls -g typescript
      - run: npm ci
      - run: npm run test:live
