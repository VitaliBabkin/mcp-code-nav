name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
      - name: Bundle
        run: |
          npm run bundle
          cp dist-bundle/index.js mcp-code-nav.js
          sha256sum mcp-code-nav.js > SHA256SUMS
      - name: Handshake against the release file
        run: node scripts/check-bundle.cjs mcp-code-nav.js
      - name: Verify the checksum file
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mcp-code-nav.js
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" mcp-code-nav.js SHA256SUMS --verify-tag --generate-notes --title "$TAG"
